description: >-
  FOCUS-aligned FinOps placeholder for Ameriprise Financial. Ameriprise does
  not publish a developer API or metered billing surface, so there are no API
  meters, charge categories, or invoice issuer columns to reconcile. This
  document keeps the FinOps shape so downstream tooling can iterate, but the
  meters listed are nominal.
notes: >-
  No public API billing surface. Replace meters with provider-issued line items
  if Ameriprise launches a developer program.
sources:
  - https://www.ameriprise.com
billingModel:
  pricingCategory: Not Applicable
  billingFrequency: Not Applicable
  billingCurrency: USD
  chargeCategories:
    - Usage
