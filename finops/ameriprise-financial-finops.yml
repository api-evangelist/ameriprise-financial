meters:
  - name: api_requests
    description: Placeholder; not currently billed by Ameriprise
    unit: request
    aggregation: sum
    dimensions:
      - consumer
principles:
  - name: Visibility
    description: >-
      No Ameriprise-issued usage telemetry exists for developers. If integrating
      via Plaid or similar aggregators, rely on the aggregator's usage dashboard.
  - name: Allocation
    description: >-
      Allocate any third-party aggregator costs to the consuming team or
      product, since Ameriprise itself does not invoice for API consumption.
  - name: Optimization
    description: >-
      The primary cost lever is aggregator selection and per-item pricing
      (Plaid, MX, Finicity), not Ameriprise tariffs.
  - name: Accountability
    description: >-
      Budget ownership sits with whichever team contracts the aggregator that
      provides Ameriprise account connectivity.
maintainers:
