specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Ameriprise Financial
providerId: ameriprise-financial
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Services
  - Wealth Management
  - Retirement
  - Insurance
  - Annuities
description: >-
  Ameriprise Financial does not currently publish a public developer API or
  associated pricing surface. Client account data is reachable via third-party
  aggregators (e.g. Plaid), whose own commercial terms govern access. There is
  no Ameriprise-issued plan tier, free quota, metered request price, or
  enterprise SKU to reconcile.
notes: >-
  No public Ameriprise developer plans exist at the time of authoring. Pricing
  for Ameriprise advisory services (Ameriprise Achiever Circle, etc.) is not an
  API plan and is intentionally omitted. If Ameriprise launches a public API
  program, replace this document with reconciled tier data.
sources:
  - https://www.ameriprise.com
  - https://www.ameriprise.com/contact-us/
plans:
  - id: ameriprise-financial-no-public-api
    name: No Public API Program
    type: enterprise
    description: >-
      Placeholder entry. Ameriprise Financial does not publish a developer API,
      pricing page, or API plan catalog. Any integration is bilateral and
      handled via partnerships, vendor onboarding, or third-party aggregators.
    entries:
      - label: Access
        description: Bilateral / partner-only; not advertised publicly
        name: access
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: 'contact provider'
        userMultiplied: false
    elements:
      - name: Bilateral Partnership
      - name: Third-Party Aggregator (e.g. Plaid)
maintainers:
