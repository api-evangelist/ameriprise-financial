x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    Ameriprise Financial serves a real /llms.txt (HTTP 200) that indexes its entire
    public site, and that index contains no developer, API, integration or partner
    section at all; every candidate developer host (developer., api., apis.,
    developers., dev., partner..ameriprise.com) fails to resolve in DNS, and
    /openapi.json, /swagger.json, /api-docs, /graphql and /mcp all 404 on
    www.ameriprise.com — the company ships client software only, not a developer
    program.
  evidence:
    - url: https://www.ameriprise.com/llms.txt
      status: 200
    - url: https://www.ameriprise.com/openapi.json
      status: 404
    - url: https://www.ameriprise.com/graphql
      status: 404
    - url: https://www.ameriprise.com/.well-known/agent-card.json
      status: 404
    - url: https://developer.ameriprise.com/
      status: 'DNS does not resolve'
  checked: '2026-09-02'
