description: >-
  Ameriprise Financial publishes no developer API, so there is no throttling
  policy, requests-per-window ceiling, burst allowance, 429 contract or
  RateLimit-* / X-RateLimit-* response-header convention to record. Re-checked
  2026-09-02: the provider's own /llms.txt site index (HTTP 200) lists no
  developer or API section, and no developer/API host resolves in DNS.
notes: >-
  limit_count is 0 because Ameriprise documents no limits, not because the docs
  were unreachable. The prior revision carried a synthetic placeholder limit row
  and an invented policy block from the 2026-05-04 bulk sweep; both asserted a
  rate-limit surface Ameriprise never published and have been removed. Consumers
  reading Ameriprise account data through an aggregator (Plaid and peers) are
  governed by that aggregator's published limits, not Ameriprise's.
